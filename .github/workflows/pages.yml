name: Publicar site PHNews

on:
  push:
    branches:
      - main
    paths:
      - "PHNews/**"
      - ".github/workflows/pages.yml"
      - "README.md"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PHNews/package-lock.json

      - name: Instalar dependências de produção
        working-directory: PHNews
        run: npm ci --omit=dev

      - name: Verificar dependências
        working-directory: PHNews
        run: npm audit --omit=dev

      - name: Montar o site e atualizar as notícias
        working-directory: PHNews
        env:
          NEWS_SNAPSHOT_PER_CATEGORY: 40
        run: npm run build:pages

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato estático
        uses: actions/upload-pages-artifact@v5
        with:
          path: PHNews/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
