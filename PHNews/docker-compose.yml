services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: phnews
      POSTGRES_USER: phnews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - phnews-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phnews -d phnews"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - phnews-uploads:/app/uploads
    environment:
      PORT: 3000
      DATABASE_URL: postgres://phnews:${POSTGRES_PASSWORD}@db:5432/phnews
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL no arquivo .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
      NEWS_FEED_URL: ${NEWS_FEED_URL:-https://agenciabrasil.ebc.com.br/rss/ultimasnoticias/feed.xml}
      NEWS_REFRESH_MINUTES: ${NEWS_REFRESH_MINUTES:-5}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  phnews-data:
  phnews-uploads:
